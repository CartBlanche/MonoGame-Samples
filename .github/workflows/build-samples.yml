name: Build Samples

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: "0 3 * * 1"   # Weekly (Mon) build to keep artifacts fresh

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  CONFIGURATION: Release

jobs:
  discover:
    runs-on: macos-latest
    outputs:
      projects: ${{ steps.collect.outputs.projects }}
      skipped: ${{ steps.collect.outputs.skipped }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect & filter Desktop platform project files
        id: collect
        shell: bash
        run: |
          set -e
          # Ensure jq is available (macOS image usually has it, fallback to brew)
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq not found, installing via Homebrew";
            brew update >/dev/null 2>&1 || true
            brew install jq >/dev/null 2>&1
          fi
          # Find all Desktop platform csproj files: **/Platforms/Desktop/*.csproj (portable without mapfile)
          desktop_projects_tmp=$(mktemp)
          find . -type f -path '*/Platforms/Desktop/*.csproj' | sort > "$desktop_projects_tmp"
          if [ ! -s "$desktop_projects_tmp" ]; then
            echo "No Desktop platform projects found."
            echo "projects=[]" >> "$GITHUB_OUTPUT"
            echo "skipped=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Testing restore for discovered Desktop projects:"
          success_tmp=$(mktemp)
          skipped_tmp=$(mktemp)
          while IFS= read -r proj; do
            echo "Attempting restore: $proj"
            if dotnet restore "$proj" >/dev/null 2>&1; then
              echo "  OK  $proj"
              echo "$proj" >> "$success_tmp"
            else
              echo "  SKIP (restore failed) $proj"
              echo "$proj" >> "$skipped_tmp"
            fi
          done < "$desktop_projects_tmp"
          if [ ! -s "$success_tmp" ]; then
            echo "No projects restored successfully.";
            echo "projects=[]" >> "$GITHUB_OUTPUT"
          else
            json=$(jq -R . < "$success_tmp" | jq -s -c .)
            echo "projects=$json" >> "$GITHUB_OUTPUT"
          fi
          if [ -s "$skipped_tmp" ]; then
            skipped_json=$(jq -R . < "$skipped_tmp" | jq -s -c .)
            echo "skipped=$skipped_json" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=[]" >> "$GITHUB_OUTPUT"
          fi
          echo "Restore filtering complete.";
          echo "Successful projects:"; cat "$success_tmp" || true
          echo "Skipped projects:"; cat "$skipped_tmp" || true
          rm -f "$desktop_projects_tmp" "$success_tmp" "$skipped_tmp"

  build-desktop-bundles:
    needs: discover
    if: ${{ needs.discover.outputs.projects != '[]' && needs.discover.outputs.projects != '' }}
    runs-on: macos-latest

    env:
      MGFXC_WINE_PATH: /Users/runner/.winemonogame
      DYLD_LIBRARY_PATH: /usr/lib:/usr/local/lib:/opt/homebrew/lib:/usr/local/bin

    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x

      - name: Setup for MonoGame
        uses: infinitespace-studios/monogame-actions/install-wine@v1.0

      - name: Install MonoPack
        run: dotnet tool install --global MonoPack

      - name: Build and Package Desktop Bundle
        id: package
        shell: bash
        run: |
          set -e
          PROJ="${{ matrix.project }}"
          NAME=$(basename "$PROJ" .csproj)
          PROJ_DIR=$(dirname "$PROJ")
          ARTIFACTS_DIR="./artifacts/$NAME"

          echo "Project path: $PROJ"
          echo "Project name: $NAME"
          echo "Project directory: $PROJ_DIR"
          echo "Output directory: $ARTIFACTS_DIR"

          echo "Building $PROJ in Release mode"
          dotnet build "$PROJ" -c Release

          # Check for macOS assets
          INFO_PLIST="$PROJ_DIR/Info.plist"
          ICNS_FILE="$PROJ_DIR/${NAME}.icns"

          if [ ! -f "$INFO_PLIST" ]; then
            echo "Error: Info.plist not found at $INFO_PLIST"
            echo "Please run ./generate-macos-assets.sh to generate macOS assets"
            exit 1
          fi

          echo "Packaging $NAME for all desktop platforms"
          if [ -f "$ICNS_FILE" ]; then
            echo "Using icon file: $ICNS_FILE"
            monopack -p "$PROJ" \
              -o "$ARTIFACTS_DIR" \
              -rids win-x64,linux-x64,osx-x64,osx-arm64 \
              -i "$INFO_PLIST" \
              -c "$ICNS_FILE" \
              -v
          else
            echo "No .icns file found, packaging without custom icon"
            monopack -p "$PROJ" \
              -o "$ARTIFACTS_DIR" \
              -rids win-x64,linux-x64,osx-x64,osx-arm64 \
              -i "$INFO_PLIST" \
              -v
          fi

          echo "Generated artifacts:"
          find "$ARTIFACTS_DIR" -type f -name "*.zip" || echo "No zip files found"
          ls -la "$ARTIFACTS_DIR" || echo "Artifacts directory not found"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload Windows Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}-Windows
          path: artifacts/${{ steps.package.outputs.name }}/*-win-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}-Linux
          path: artifacts/${{ steps.package.outputs.name }}/*-linux-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}-macOS
          path: artifacts/${{ steps.package.outputs.name }}/*-universal.zip
          if-no-files-found: error
          retention-days: 14

  summary:
    needs: [discover, build-desktop-bundles]
    if: always()
    runs-on: macos-latest
    steps:
      - name: Build Summary
        run: |
          echo "Desktop sample build summary:" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.discover.outputs.projects }}" = "[]" ] || [ -z "${{ needs.discover.outputs.projects }}" ]; then
            echo "- No Desktop platform projects were built (no successful restores)." >> $GITHUB_STEP_SUMMARY
          else
            echo "- Projects bundled: ${{ needs.discover.outputs.projects }}" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "${{ needs.discover.outputs.skipped }}" ] && [ "${{ needs.discover.outputs.skipped }}" != "[]" ]; then
            echo "- Skipped (restore failed): ${{ needs.discover.outputs.skipped }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- Cross-platform bundles (Windows, Linux, macOS) are available as separate artifacts." >> $GITHUB_STEP_SUMMARY
