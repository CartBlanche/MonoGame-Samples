name: Build Samples

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: "0 3 * * 1"   # Weekly (Mon) build to keep artifacts fresh

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  CONFIGURATION: Release

jobs:
  discover:
    runs-on: macos-latest
    outputs:
      projects: ${{ steps.collect.outputs.projects }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect Desktop platform project files
        id: collect
        shell: bash
        run: |
          set -e
          # Ensure jq is available (macOS image usually has it, fallback to brew)
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq not found, installing via Homebrew";
            brew update >/dev/null 2>&1 || true
            brew install jq >/dev/null 2>&1
          fi
          # Find all Desktop platform csproj files: **/Platforms/Desktop/*.csproj (portable without mapfile)
          desktop_projects_tmp=$(mktemp)
          find . -type f -path '*/Platforms/Desktop/*.csproj' | sort > "$desktop_projects_tmp"
          if [ ! -s "$desktop_projects_tmp" ]; then
            echo "No Desktop platform projects found."
            echo "projects=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Discovered Desktop projects:";
          sed 's/^/  /' "$desktop_projects_tmp"
          # Build compact single-line JSON array and write to output
          json=$(jq -R . < "$desktop_projects_tmp" | jq -s -c .)
          echo "projects=$json" >> "$GITHUB_OUTPUT"
          rm -f "$desktop_projects_tmp"

  build:
    needs: discover
    if: ${{ needs.discover.outputs.projects != '[]' && needs.discover.outputs.projects != '' }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x

      - name: Restore (solution-wide)
        run: dotnet restore

      - name: Publish sample
        id: publish
        shell: bash
        run: |
          set -e
          PROJ="${{ matrix.project }}"
          NAME=$(basename "$PROJ" .csproj)
          OUTDIR="publish/$NAME"
          echo "Publishing $PROJ -> $OUTDIR"
          dotnet publish "$PROJ" -c "$CONFIGURATION" -o "$OUTDIR"
          echo "Published files:"
          # Portable listing (macOS BSD find lacks -printf)
          find "$OUTDIR" -type f | sed "s|$OUTDIR/|  |"
          echo "outdir=$OUTDIR" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Zip artifact
        id: zip
        shell: bash
        run: |
          set -e
          NAME="${{ steps.publish.outputs.name }}"
          OUTDIR="${{ steps.publish.outputs.outdir }}"
          ZIP="artifact-${NAME}.zip"
          (cd "$OUTDIR" && zip -rq "../../$ZIP" .)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sample-${{ steps.publish.outputs.name }}
          # Use the known artifact file name we just created
          path: artifact-${{ steps.publish.outputs.name }}.zip
          if-no-files-found: error
          retention-days: 14

  summary:
    needs: [discover, build]
    if: always()
    runs-on: macos-latest
    steps:
      - name: Build Summary
        run: |
          echo "Desktop sample build summary:" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.discover.outputs.projects }}" = "[]" ] || [ -z "${{ needs.discover.outputs.projects }}" ]; then
            echo "- No Desktop platform projects were found." >> $GITHUB_STEP_SUMMARY
          else
            echo "- Projects built: ${{ needs.discover.outputs.projects }}" >> $GITHUB_STEP_SUMMARY
            echo "- Individual zipped artifacts are available under the workflow run artifacts section." >> $GITHUB_STEP_SUMMARY
