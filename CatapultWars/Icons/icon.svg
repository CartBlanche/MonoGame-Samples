<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024">
  <!-- Transparent background. Blue catapult (frame 4 of the pull-back animation) with its blue crew
       member standing 5px behind it, as in the game. 1 game pixel = 10 icon units; crew at half size. -->
  <g transform="translate(-130 212) scale(10)">
    <!-- Catapult frame, 75x60 game pixels -->
    <image x="29" y="0" width="75" height="60" preserveAspectRatio="none" image-rendering="optimizeSpeed"
           xlink:href="data:image/png;base64,"/>

    <!-- Crew member, 44x48 texture, feet at (22,46); left of the catapult, feet on the ground -->
    <g transform="translate(21 36) scale(.5)" stroke-linecap="round">
      <!-- legs and boots -->
      <path d="M19 34 L18 44 M25 34 L26 44" stroke="#4e3a28" stroke-width="5.4" fill="none"/>
      <ellipse cx="18" cy="45" rx="3.6" ry="1.8" fill="#342216"/>
      <ellipse cx="27" cy="45" rx="3.6" ry="1.8" fill="#342216"/>
      <!-- arms behind the body -->
      <path d="M15 24 L10.53 34.05" stroke="#3464ce" stroke-width="5" fill="none"/>
      <circle cx="10.53" cy="34.05" r="2.6" fill="#eec492"/>
      <path d="M29 24 L33.47 34.05" stroke="#3464ce" stroke-width="5" fill="none"/>
      <circle cx="33.47" cy="34.05" r="2.6" fill="#eec492"/>
      <!-- tunic and belt -->
      <ellipse cx="22" cy="28" rx="8.5" ry="9" fill="#3464ce"/>
      <rect x="14" y="32" width="16" height="2" fill="#1e3e8c"/>
      <!-- head and leather cap -->
      <circle cx="22" cy="14" r="7" fill="#eec492"/>
      <path d="M14.2 12 A7.8 6.2 0 0 1 29.8 12 Z" fill="#966234"/>
      <!-- face -->
      <ellipse cx="19.5" cy="14.5" rx=".95" ry="1.1" fill="#342216"/>
      <ellipse cx="25" cy="14.5" rx=".95" ry="1.1" fill="#342216"/>
      <path d="M20.5 18 L25 18" stroke="#342216" stroke-width="1.2" fill="none"/>
    </g>
  </g>
</svg>
